<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mesa de Batalha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-table:#12161d;
    --grid-line:rgba(255,255,255,0.045);
    --panel-bg:#171c25;
    --card-bg:#1c2330;
    --card-border:rgba(255,255,255,0.07);
    --heroes:#5b9bd8;
    --heroes-dim:#3d6b93;
    --monsters:#d16a55;
    --monsters-dim:#96493a;
    --text-primary:#ece7d8;
    --text-muted:#8b91a3;
    --hp-high:#6fbf73;
    --hp-mid:#d9a441;
    --hp-low:#dd5a4a;
    --danger-flash:#c1554a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-table);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:32px 32px;
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 24px 80px;
  }
  h1{
    font-family:'Spectral',serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:0.3px;
  }
  .subtitle{
    color:var(--text-muted);
    font-size:14px;
    margin:0 0 32px;
  }
  .board{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    max-width:1100px;
    margin:0 auto;
  }
  @media (max-width:760px){ .board{grid-template-columns:1fr;} }
  .column{
    background:var(--panel-bg);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:20px;
  }
  .column-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .column-title{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:19px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .side-dot{width:10px;height:10px;border-radius:50%;}
  .side-heroes .side-dot{background:var(--heroes);}
  .side-monsters .side-dot{background:var(--monsters);}
  .add-btn{
    background:transparent;
    border:1px dashed var(--card-border);
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:10px;
    width:100%;
    border-radius:10px;
    cursor:pointer;
    margin-top:12px;
    transition:border-color .15s, color .15s, background .15s;
  }
  .side-heroes .add-btn:hover{border-color:var(--heroes); color:var(--heroes); background:rgba(91,155,216,0.06);}
  .side-monsters .add-btn:hover{border-color:var(--monsters); color:var(--monsters); background:rgba(209,106,85,0.06);}
  .cards{display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-left:3px solid var(--accent);
    border-radius:10px;
    padding:14px 16px;
    position:relative;
    overflow:visible;
    transition:transform .12s;
  }
  .card.hit{animation:shake .32s;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(3px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }
  .card.flash::before{
    content:"";
    position:absolute; inset:0;
    background:var(--danger-flash);
    opacity:0.22;
    border-radius:9px;
    animation:fadeout .5s forwards;
    pointer-events:none;
  }
  @keyframes fadeout{ to{opacity:0;} }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
  }
  .name-input{
    background:transparent;
    border:none;
    color:var(--text-primary);
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:16px;
    padding:2px 0;
    width:100%;
    border-bottom:1px solid transparent;
  }
  .name-input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .del-btn{
    background:none; border:none; color:var(--text-muted);
    font-size:16px; cursor:pointer; line-height:1; padding:2px 4px;
    flex-shrink:0;
  }
  .del-btn:hover{color:var(--monsters);}
  .hp-row{display:flex; align-items:baseline; gap:6px; margin-bottom:6px;}
  .hp-numbers{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-muted);}
  .hp-current{color:var(--text-primary); font-weight:600;}
  .maxhp-input{
    width:44px; background:transparent; border:none; border-bottom:1px dashed var(--card-border);
    color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:13px; padding:0 2px;
  }
  .maxhp-input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .hp-track{
    position:relative;
    height:16px;
    background:#0e1218;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:12px;
    border:1px solid var(--card-border);
  }
  .hp-fill{
    height:100%;
    transition:width .25s ease, background .25s ease;
    position:relative;
  }
  .hp-ticks{
    position:absolute; inset:0;
    display:flex;
  }
  .hp-ticks span{
    flex:1;
    border-right:1px solid rgba(0,0,0,0.35);
  }
  .hp-ticks span:last-child{border-right:none;}
  .float-dmg{
    position:absolute;
    right:6px; top:-4px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    pointer-events:none;
    animation:floatup 1s ease-out forwards;
  }
  @keyframes floatup{
    0%{opacity:1; transform:translateY(0);}
    100%{opacity:0; transform:translateY(-24px);}
  }
  .quick-row{display:flex; gap:5px; margin-bottom:8px; flex-wrap:wrap;}
  .quick-btn{
    flex:1;
    min-width:34px;
    background:#12161e;
    border:1px solid var(--card-border);
    color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 2px;
    border-radius:6px;
    cursor:pointer;
  }
  .quick-btn:hover{border-color:var(--accent); color:var(--text-primary);}
  .free-row{display:flex; gap:6px; margin-bottom:12px;}
  .free-input{
    width:56px;
    background:#12161e;
    border:1px solid var(--card-border);
    color:var(--text-primary);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    border-radius:6px;
    padding:6px 8px;
  }
  .free-input:focus{outline:none; border-color:var(--accent);}
  .free-btn{
    flex:1;
    border:1px solid var(--card-border);
    background:transparent;
    color:var(--text-primary);
    font-size:12px;
    font-weight:500;
    border-radius:6px;
    cursor:pointer;
  }
  .free-btn.heal:hover{border-color:var(--hp-high); color:var(--hp-high);}
  .free-btn.dmg:hover{border-color:var(--hp-low); color:var(--hp-low);}
  .attacks-label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin:4px 0 6px;}
  .attacks{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .attack-chip{
    position:relative;
    background:#12161e;
    border:1px solid var(--card-border);
    color:var(--text-primary);
    font-size:12px;
    padding:6px 10px;
    border-radius:16px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .attack-chip:hover{border-color:var(--accent);}
  .attack-chip .dmg-tag{font-family:'IBM Plex Mono',monospace; color:var(--monsters); font-weight:600;}
  .attack-chip .rm{color:var(--text-muted); font-size:12px; margin-left:2px;}
  .attack-chip .rm:hover{color:var(--danger-flash);}
  .add-attack-form{display:flex; gap:6px; align-items:center;}
  .add-attack-form input{
    background:#12161e; border:1px solid var(--card-border); color:var(--text-primary);
    font-size:12px; border-radius:6px; padding:6px 8px;
  }
  .aa-name{flex:1; min-width:0;}
  .aa-dmg{width:48px; font-family:'IBM Plex Mono',monospace;}
  .aa-add{
    background:transparent; border:1px solid var(--card-border); color:var(--text-muted);
    border-radius:6px; padding:6px 9px; cursor:pointer; font-size:14px; line-height:1;
  }
  .aa-add:hover{color:var(--accent); border-color:var(--accent);}
  .popover{
    position:absolute; z-index:20; background:#20283a; border:1px solid var(--card-border);
    border-radius:10px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
    min-width:180px; top:100%; left:0; margin-top:6px;
  }
  .popover-label{font-size:11px; color:var(--text-muted); padding:2px 6px 6px;}
  .popover-item{
    display:flex; justify-content:space-between; gap:10px;
    padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .popover-item:hover{background:rgba(255,255,255,0.06);}
  .popover-item .t-hp{font-family:'IBM Plex Mono',monospace; color:var(--text-muted);}
  .popover-empty{padding:8px; font-size:12px; color:var(--text-muted);}
  .empty-col{color:var(--text-muted); font-size:13px; padding:18px 0; text-align:center;}
  .log-wrap{max-width:1100px; margin:28px auto 0;}
  .log-title{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin-bottom:8px;}
  .log{
    background:var(--panel-bg); border:1px solid var(--card-border); border-radius:10px;
    padding:10px 14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-muted);
    max-height:160px; overflow-y:auto;
  }
  .log div{padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.04);}
  .log div:last-child{border-bottom:none;}
  .log .lg-dmg{color:var(--monsters);}
  .log .lg-heal{color:var(--hp-high);}
</style>
</head>
<body>

<h1>Mesa de Batalha</h1>
<p class="subtitle">Vida e ataques do encontro atual — clique num ataque para mirar em alguém.</p>

<div class="board">
  <div class="column side-heroes" id="col-left">
    <div class="column-header">
      <div class="column-title"><span class="side-dot"></span>Heróis</div>
    </div>
    <div class="cards" id="cards-left"></div>
    <button class="add-btn" onclick="addCharacter('left')">+ Novo herói</button>
  </div>
  <div class="column side-monsters" id="col-right">
    <div class="column-header">
      <div class="column-title"><span class="side-dot"></span>Inimigos</div>
    </div>
    <div class="cards" id="cards-right"></div>
    <button class="add-btn" onclick="addCharacter('right')">+ Novo inimigo</button>
  </div>
</div>

<div class="log-wrap">
  <div class="log-title">Registro de combate</div>
  <div class="log" id="log"><div style="color:var(--text-muted)">Nenhuma ação ainda.</div></div>
</div>

<script>
let nextId = 1;
let openPopoverId = null;

let state = [
  {id:nextId++, side:'left', name:'Elyra', maxHp:32, hp:32, attacks:[{id:1,name:'Espada longa',dmg:8},{id:2,name:'Flecha',dmg:5}]},
  {id:nextId++, side:'left', name:'Doran', maxHp:28, hp:19, attacks:[{id:1,name:'Machado duplo',dmg:11}]},
  {id:nextId++, side:'right', name:'Goblin batedor', maxHp:15, hp:15, attacks:[{id:1,name:'Adaga', dmg:4}]},
  {id:nextId++, side:'right', name:'Ogro', maxHp:45, hp:45, attacks:[{id:1,name:'Porrete', dmg:14}]},
];
let attackIdCounters = {};
state.forEach(c => attackIdCounters[c.id] = c.attacks.length + 1);

function findChar(id){ return state.find(c => c.id === id); }

function hpColor(pct){
  if(pct > 0.5) return 'var(--hp-high)';
  if(pct > 0.2) return 'var(--hp-mid)';
  return 'var(--hp-low)';
}

function addCharacter(side){
  const id = nextId++;
  attackIdCounters[id] = 1;
  state.push({id, side, name: side==='left' ? 'Novo herói' : 'Novo inimigo', maxHp:20, hp:20, attacks:[]});
  render();
}

function removeCharacter(id){
  state = state.filter(c => c.id !== id);
  render();
}

function renameChar(id, val){
  findChar(id).name = val || 'Sem nome';
}

function setMaxHp(id, val){
  const c = findChar(id);
  let v = parseInt(val) || 1;
  if(v < 1) v = 1;
  c.maxHp = v;
  if(c.hp > v) c.hp = v;
  render();
}

function applyDelta(id, delta){
  const c = findChar(id);
  const prev = c.hp;
  c.hp = Math.max(0, Math.min(c.maxHp, c.hp + delta));
  const actual = c.hp - prev;
  if(actual !== 0){
    addLog(c.name + (actual > 0 ? ' recuperou ' : ' perdeu ') + Math.abs(actual) + ' HP', actual > 0 ? 'heal' : 'dmg');
    pulseCard(id, actual < 0);
  }
  render();
}

function applyFree(id, mode){
  const input = document.getElementById('free-'+id);
  const v = parseInt(input.value);
  if(!v || v <= 0) return;
  applyDelta(id, mode === 'dmg' ? -v : v);
}

function addAttack(charId){
  const nameInput = document.getElementById('aa-name-'+charId);
  const dmgInput = document.getElementById('aa-dmg-'+charId);
  const name = nameInput.value.trim();
  const dmg = parseInt(dmgInput.value);
  if(!name || !dmg || dmg <= 0) return;
  const c = findChar(charId);
  c.attacks.push({id: attackIdCounters[charId]++, name, dmg});
  render();
}

function removeAttack(charId, atkId){
  const c = findChar(charId);
  c.attacks = c.attacks.filter(a => a.id !== atkId);
  render();
}

function toggleTargetPopover(key){
  openPopoverId = (openPopoverId === key) ? null : key;
  render();
}

function applyAttack(attackerId, atkId, targetId){
  const attacker = findChar(attackerId);
  const atk = attacker.attacks.find(a => a.id === atkId);
  const target = findChar(targetId);
  const prev = target.hp;
  target.hp = Math.max(0, target.hp - atk.dmg);
  const actual = prev - target.hp;
  addLog(attacker.name + ' atacou ' + target.name + ' com ' + atk.name + ' (-' + actual + ')', 'dmg');
  openPopoverId = null;
  pulseCard(targetId, true);
  render();
  showFloat(targetId, '-' + actual);
}

function addLog(text, kind){
  const log = document.getElementById('log');
  if(log.children.length === 1 && log.children[0].textContent === 'Nenhuma ação ainda.'){
    log.innerHTML = '';
  }
  const line = document.createElement('div');
  line.innerHTML = '<span class="lg-' + kind + '">' + text + '</span>';
  log.prepend(line);
  while(log.children.length > 10) log.removeChild(log.lastChild);
}

let pulseFlags = {};
function pulseCard(id, isDamage){
  pulseFlags[id] = isDamage ? 'flash' : 'shakeonly';
}

let floatFlags = {};
function showFloat(id, text){
  floatFlags[id] = text;
  render();
  setTimeout(() => { delete floatFlags[id]; }, 950);
}

function renderCard(c){
  const accent = c.side === 'left' ? 'var(--heroes)' : 'var(--monsters)';
  const pct = c.maxHp > 0 ? c.hp / c.maxHp : 0;
  const color = hpColor(pct);
  const pulseClass = pulseFlags[c.id] === 'flash' ? 'hit flash' : (pulseFlags[c.id] === 'shakeonly' ? 'hit' : '');
  delete pulseFlags[c.id];

  const ticks = Array.from({length:10}).map(()=>'<span></span>').join('');
  const floatHtml = floatFlags[c.id] ? '<span class="float-dmg" style="color:'+color+'">'+floatFlags[c.id]+'</span>' : '';

  const attacksHtml = c.attacks.map(a => {
    const popKey = c.id + '-' + a.id;
    const isOpen = openPopoverId === popKey;
    let popHtml = '';
    if(isOpen){
      const targets = state.filter(t => t.hp > 0);
      const items = targets.length
        ? targets.map(t => '<div class="popover-item" onclick="event.stopPropagation(); applyAttack('+c.id+','+a.id+','+t.id+')"><span>'+escapeHtml(t.name)+'</span><span class="t-hp">'+t.hp+'/'+t.maxHp+'</span></div>').join('')
        : '<div class="popover-empty">Ninguém de pé.</div>';
      popHtml = '<div class="popover" onclick="event.stopPropagation()"><div class="popover-label">Escolher alvo</div>'+items+'</div>';
    }
    return '<div class="attack-chip" onclick="toggleTargetPopover(\''+popKey+'\')">'
      + escapeHtml(a.name) + ' <span class="dmg-tag">-' + a.dmg + '</span>'
      + '<span class="rm" onclick="event.stopPropagation(); removeAttack('+c.id+','+a.id+')">✕</span>'
      + popHtml
      + '</div>';
  }).join('');

  return '<div class="card '+pulseClass+'" style="--accent:'+accent+'">'
    + '<div class="card-top">'
      + '<input class="name-input" value="'+escapeAttr(c.name)+'" onchange="renameChar('+c.id+',this.value)">'
      + '<button class="del-btn" onclick="removeCharacter('+c.id+')" aria-label="Remover personagem">✕</button>'
    + '</div>'
    + '<div class="hp-row"><span class="hp-numbers"><span class="hp-current">'+c.hp+'</span> / <input class="maxhp-input" type="number" min="1" value="'+c.maxHp+'" onchange="setMaxHp('+c.id+',this.value)"> HP</span></div>'
    + '<div class="hp-track">'
      + '<div class="hp-fill" style="width:'+(pct*100)+'%; background:'+color+'"><div class="hp-ticks">'+ticks+'</div></div>'
      + floatHtml
    + '</div>'
    + '<div class="quick-row">'
      + [10,5,1].map(v => '<button class="quick-btn" onclick="applyDelta('+c.id+',-'+v+')">-'+v+'</button>').join('')
      + [1,5,10].map(v => '<button class="quick-btn" onclick="applyDelta('+c.id+','+v+')">+'+v+'</button>').join('')
    + '</div>'
    + '<div class="free-row">'
      + '<input class="free-input" type="number" min="1" placeholder="qtd" id="free-'+c.id+'">'
      + '<button class="free-btn dmg" onclick="applyFree('+c.id+',\'dmg\')">Dano</button>'
      + '<button class="free-btn heal" onclick="applyFree('+c.id+',\'heal\')">Curar</button>'
    + '</div>'
    + '<div class="attacks-label">Ataques</div>'
    + '<div class="attacks">'+attacksHtml+'</div>'
    + '<div class="add-attack-form">'
      + '<input class="aa-name" placeholder="nome do ataque" id="aa-name-'+c.id+'">'
      + '<input class="aa-dmg" type="number" min="1" placeholder="dano" id="aa-dmg-'+c.id+'">'
      + '<button class="aa-add" onclick="addAttack('+c.id+')" aria-label="Adicionar ataque">+</button>'
    + '</div>'
  + '</div>';
}

function escapeHtml(s){ return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function render(){
  const left = state.filter(c => c.side === 'left');
  const right = state.filter(c => c.side === 'right');
  document.getElementById('cards-left').innerHTML = left.length
    ? left.map(renderCard).join('')
    : '<div class="empty-col">Sem heróis na mesa ainda.</div>';
  document.getElementById('cards-right').innerHTML = right.length
    ? right.map(renderCard).join('')
    : '<div class="empty-col">Sem inimigos na mesa ainda.</div>';
}

document.addEventListener('click', (e) => {
  if(!e.target.closest('.attack-chip')){
    if(openPopoverId){ openPopoverId = null; render(); }
  }
});

render();
</script>

</body>
</html>
